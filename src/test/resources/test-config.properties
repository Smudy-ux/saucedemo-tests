# Single source of truth for environment, credentials and test users.

base.url=https://www.saucedemo.com/

# Browser
# Leave blank to use the default Chrome install and let Selenium Manager fetch chromedriver.
# Linux example: browser.binary=/usr/bin/chromium  browser.driver=/usr/bin/chromedriver
browser.binary=
browser.driver=
browser.headless=true

# Credentials (all SauceDemo users share one password)
password=secret_sauce

# Users accepted by the login page (verified against the page by UserListTest)
users=standard_user,locked_out_user,problem_user,performance_glitch_user,error_user,visual_user

# Reference user whose behaviour defines "correct"
baseline.user=standard_user

# Users rejected at login by design (inventory/cart/checkout tests are skipped for them)
known.lockedOutUsers=locked_out_user

# Explicit-wait timeout. Kept well above the perf limit so slow logins get measured, not cut off.
wait.timeout.seconds=15

# Login performance threshold
perf.login.maxMillis=3000

# Checkout data
checkout.firstName=Test
checkout.lastName=User
checkout.postalCode=12345
